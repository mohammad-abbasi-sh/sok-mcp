[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sok-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for ŞOK grocery (sokmarket.com.tr) products, categories, campaigns, prices"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
    "requests>=2.32",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
sok-mcp = "sok_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sok_mcp"]
